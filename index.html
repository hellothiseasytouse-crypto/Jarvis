<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'" />
  <title>JARVIS</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-state="ready">
  <div class="app">
    <header class="topbar">
      <div class="core" aria-hidden="true"><span class="core-ring"></span><span class="core-dot"></span></div>
      <h1 class="name">JARVIS</h1>
      <p class="status" id="status" role="status" aria-live="polite">Ready</p>
    </header>

    <main class="thread" id="thread" aria-label="Conversation">
      <div class="empty" id="empty">
        <p class="empty-title">Ask JARVIS anything</p>
        <p class="empty-body">Replies are placeholders until Groq is connected in the next step. Type <code>/fail</code> to preview the error state.</p>
      </div>
      <ol class="messages" id="messages"></ol>
    </main>

    <footer class="composer">
      <div class="composer-box">
        <button class="icon-btn" id="mic" type="button" disabled
                aria-label="Voice input" title="Voice input comes later">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="9" y="3" width="6" height="11" rx="3"></rect>
            <path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path>
          </svg>
        </button>
        <textarea id="input" rows="1" maxlength="4000" placeholder="Message JARVIS" aria-label="Message"></textarea>
        <button class="send-btn" id="send" type="button">Send</button>
      </div>
      <p class="hint">Enter to send, Shift+Enter for a new line</p>
    </footer>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
